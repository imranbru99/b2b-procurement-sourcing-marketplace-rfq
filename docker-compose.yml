services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEMO: "true"
      DB_HOST: mysql
      DB_DATABASE: procurement_marketplace
      DB_USERNAME: marketplace
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      - mysql
      - redis
    networks:
      - marketplace

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - marketplace

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: procurement_marketplace
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - marketplace

  redis:
    image: redis:7-alpine
    networks:
      - marketplace

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app
      - redis
    networks:
      - marketplace

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      APP_DEMO: "true"
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      - app
    networks:
      - marketplace

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    volumes:
      - .:/var/www/html
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    networks:
      - marketplace

networks:
  marketplace:

volumes:
  mysql_data:
